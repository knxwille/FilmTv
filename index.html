<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>.: FilmTv Portal Menu ::.</title>
    <style>
        body {
            background-color: #141414; /* TV'lerde göz yormasın diye koyu tema */
            color: white;
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
        }

        .button-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 500px; /* TV ekranlarında çok dar kalmasın diye biraz genişlettik */
            margin: 40px auto;
        }

        .dynamic-button {
            display: block;
            padding: 16px 20px; /* TV'de rahat görünmesi için butonları biraz irileştirdik */
            background-color: #222;
            color: #fff;
            text-align: center;
            text-decoration: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            border: 2px solid transparent;
            transition: all 0.2s ease;
            outline: none; /* Tarayıcının varsayılan çirkin çerçevesini kaldır */
        }

        /* HEM TELEFONDA ÜZERİNE GELİNCE (HOVER) SM-TV KUMANDASI İLE SEÇİLİNCE (FOCUS) ÇALIŞACAK ALAN */
        .dynamic-button:hover, .dynamic-button:focus {
            background-color: #28a745; /* Seçilen buton yeşil olur */
            color: white;
            border-color: #ffffff; /* Kenarları beyaz parlar */
            transform: scale(1.03); /* TV'de seçildiğini belli etmek için hafifçe büyür */
        }

        .error-msg {
            color: red;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="iptv-buttons" class="button-container"></div>

   <script>
        const container = document.getElementById("iptv-buttons");

        async function loadLinksFromTXT() {
            try {
                const response = await fetch('https://knxwille.github.io/FilmTv/liste.txt');
                if (!response.ok) throw new Error('Metin dosyası yüklenemedi!');

                const textData = await response.text();
                const lines = textData.split(/\r?\n/);

                let buttonIndex = 1;

                lines.forEach(line => {
                    if (line.trim() === '') return;
                    const parts = line.split(',');
                    
                    if (parts.length >= 2) {
                        const name = parts[0].trim();
                        const url = parts.slice(1).join(',').trim(); 

                        const btn = document.createElement("a");
                        btn.href = url;
                        btn.innerText = name;
                        btn.className = "dynamic-button";
                        btn.target = "_self";
                        btn.setAttribute('tabindex', buttonIndex);
                        buttonIndex++;

                        container.appendChild(btn);
                    }
                });

                const firstBtn = container.querySelector('.dynamic-button');
                if(firstBtn) firstBtn.focus();

            } catch (error) {
                console.error('Hata:', error);
                container.innerHTML = `<p class="error-msg">Liste yüklenirken bir hata oluştu.</p>`;
            }
        }

        // --- DÜZELTME BURADA: Bu satır artık doğru yerde ---
        window.addEventListener('DOMContentLoaded', loadLinksFromTXT);

        document.addEventListener("keydown", function(e) {
            const focusable = Array.from(document.querySelectorAll('.dynamic-button'));
            let currentIndex = focusable.indexOf(document.activeElement);

            if (e.key === "ArrowDown") {
                e.preventDefault();
                let nextIndex = (currentIndex + 1) % focusable.length;
                focusable[nextIndex].focus();
            } else if (e.key === "ArrowUp") {
                e.preventDefault();
                let nextIndex = (currentIndex - 1 + focusable.length) % focusable.length;
                focusable[nextIndex].focus();
            } else if (e.key === "Enter" || e.key === " ") {
                if (document.activeElement.classList.contains('dynamic-button')) {
                    document.activeElement.click();
                }
            }
            // Sayfa yüklendikten 2 saniye sonra bir kere daha odaklanmayı zorla
setTimeout(() => {
    const firstBtn = document.querySelector('.dynamic-button');
    if (firstBtn) {
        firstBtn.focus();
        console.log("İLK ODAK ZORLANDI");
    }
}, 2000);
        });
    </script>

</body>
</html>
