<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TXT'den Dinamik Buton Listesi</title>
    <style>
        .button-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 300px;
            margin: 20px auto;
        }

        .dynamic-button {
            display: block;
            padding: 12px 20px;
            background-color: #28a745; /* Yeşil tonu */
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 5px;
            font-family: sans-serif;
            font-weight: bold;
            transition: background-color 0.2s ease;
        }

        .dynamic-button:hover {
            background-color: #218838;
        }

        /* Hata durumunda görünecek mesaj için */
        .error-msg {
            color: red;
            text-align: center;
            font-family: sans-serif;
        }
    </style>
</head>
<body>

    <div id="iptv-buttons" class="button-container"></div>

    <script>
        const container = document.getElementById("iptv-buttons");

        // TXT dosyasını okuyan ve butonları basan fonksiyon
        async function loadLinksFromTXT() {
            try {
                // 1. liste.txt dosyasını sunucudan talep ediyoruz
                const response = await fetch('liste.txt');
                
                if (!response.ok) {
                    throw new Error('Metin dosyası yüklenemedi!');
                }

                // 2. Dosya içeriğini düz metin olarak alıyoruz
                const textData = await response.text();

                // 3. Metni satır satır bölüyoruz (\r\n veya \n uyumluluğu için regex kullandık)
                const lines = textData.split(/\r?\n/);

                // 4. Her satırı döngüyle işliyoruz
                lines.forEach(line => {
                    // Boş satırları atla
                    if (line.trim() === '') return;

                    // Satırı virgüle (,) göre isim ve url olarak ikiye ayırıyoruz
                    const parts = line.split(',');
                    
                    if (parts.length >= 2) {
                        const name = parts[0].trim();
                        // URL içinde de virgül olma ihtimaline karşı geri kalan kısmı birleştiriyoruz
                        const url = parts.slice(1).join(',').trim(); 

                        // Butonu oluşturma adımları
                        const btn = document.createElement("a");
                        btn.href = url;
                        btn.innerText = name;
                        btn.className = "dynamic-button";
                        btn.target = "_blank"; // Yeni sekmede aç

                        // Container'a ekle
                        container.appendChild(btn);
                    }
                });

            } catch (error) {
                console.error('Hata:', error);
                container.innerHTML = `<p class="error-msg">Liste yüklenirken bir hata oluştu: ${error.message}</p>`;
            }
        }

        // Sayfa yüklendiğinde fonksiyonu çalıştır
        window.addEventListener('DOMContentLoaded', loadLinksFromTXT);
    </script>

</body>
</html>
